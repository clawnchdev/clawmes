[project]
name = "clawmes"
version = "0.17.2"
description = "Hermes Agent plugin for crypto: wallets, DEX trading, lending and staking, governance, on-chain automation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Clawnch", email = "dev@clawn.ch" }]
requires-python = ">=3.11"
keywords = [
    "hermes",
    "hermes-agent",
    "clawmes",
    "crypto",
    "defi",
    "walletconnect",
    "agent",
    "ai",
    "assistant",
    "blockchain",
    "base",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Note: hermes-agent is intentionally NOT listed here. Hermes is not
    # published to PyPI — users install it via the upstream installer
    # (curl https://raw.githubusercontent.com/NousResearch/hermes-agent/
    # main/scripts/install.sh | bash) or `pip install` from a git URL.
    # Clawmes' tests use a FakePluginContext and don't need the real
    # Hermes runtime; production deployments install Hermes separately.
    "web3>=7.0.0",
    "eth-account>=0.13.0",
    "eth-utils>=4.0.0",
    "mnemonic>=0.21",
    "pycryptodome>=3.20.0",
    "keyring>=25.0.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typing_extensions>=4.12",
    # QR rendering for the Hermes Desktop connect card. Pinned WITHOUT the
    # [pil] extra so only pure-Python qrcode is pulled in (no Pillow / C
    # extensions); we use the SvgPathImage factory. BSD-licensed.
    "qrcode>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # MCP SDK is in dev so tests/mcp_server/* can import it; the same
    # SDK ships under the [mcp] extra for production use of the
    # clawmes-mcp script entry.
    "mcp>=1.0",
]
test-network = [
    "responses>=0.25",
    "vcrpy>=6.0",
]
# Optional: expose clawmes' read tools as an MCP server for desktop AI
# clients (Claude Desktop, Cursor, ChatGPT). Install with:
#   pip install clawmes[mcp]
# Run with:
#   clawmes-mcp
mcp = [
    "mcp>=1.0",
]
all = [
    "clawmes[dev,test-network,mcp]",
]

[project.entry-points."hermes_agent.plugins"]
clawmes = "clawmes"

[project.scripts]
# `clawmes-mcp` exposes clawmes' read tools to MCP-compatible clients
# (Claude Desktop, Cursor, ChatGPT). Requires the [mcp] extra to be
# installed; otherwise the import fails at runtime with a clear message
# pointing the user at the install command.
clawmes-mcp = "clawmes.mcp_server:main"

[project.urls]
Homepage = "https://clawnch.dev"
Repository = "https://github.com/clawnchdev/clawmes"
Issues = "https://github.com/clawnchdev/clawmes/issues"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clawmes*"]

[tool.setuptools.package-data]
clawmes = [
    "data/SOUL.md",
    "data/*.json",
    "data/personas/*.md",
    "skills/*/SKILL.md",
    "skills/*/scripts/*",
    "skills/*/references/*",
    "bridges/sources/wc/package.json",
    "bridges/sources/wc/package-lock.json",
    "bridges/sources/wc/tsconfig.json",
    "bridges/sources/wc/src/*.ts",
    "bridges/sources/wc/dist/*.mjs",
    "bridges/sources/wc/dist/*.js",
    "plugin.yaml",
]

# Belt-and-suspenders: excludes that match the wc/sa exclusion above
# even if a future package-data pattern accidentally globs node_modules.
[tool.setuptools.exclude-package-data]
clawmes = [
    "bridges/sources/*/node_modules/**",
    "bridges/sources/*/.installed-hash",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# importlib mode: avoids package-collision when test files share a
# basename across subdirectories (tests/services/test_registry.py and
# tests/tools/test_registry.py). Combined with no `tests/__init__.py`,
# this lets the repo root host an outer __init__.py shim for Hermes
# plugin discovery without pytest mistaking `tests/` for a subpackage
# of `clawmes`.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = false
source = ["clawmes"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
