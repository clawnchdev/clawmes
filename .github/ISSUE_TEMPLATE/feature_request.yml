name: Feature request
description: Suggest a new tool, command, integration, or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need, not the implementation. "I want to do X but can't."
      placeholder: |
        Example: I want to track my Polymarket positions inside clawmes but currently
        have to switch to a separate tool.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        How would this work? If it's a new tool, what's the action surface
        (action enum, required args)? If it's a command, what does it do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this. Why is your proposal better?

  - type: dropdown
    id: scope
    attributes:
      label: Scope estimate
      options:
        - "Small (single tool action / command)"
        - "Medium (new tool / new service)"
        - "Large (cross-cutting — new wallet mode, etc.)"
        - "Not sure"
