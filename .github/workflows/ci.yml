name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check clawmes/ tests/

      - name: Format check
        run: ruff format --check clawmes/ tests/

      - name: Type check
        run: mypy clawmes/
        continue-on-error: true   # non-strict mode at this milestone

      - name: Test
        run: pytest -q --cov=clawmes --cov-report=term-missing

  bridges-build:
    runs-on: ubuntu-latest
    if: false  # disabled until bridge sources land
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build wc bridge
        run: |
          cd clawmes/bridges/sources/wc
          npm ci
          npm run build
      - name: Build sa bridge
        run: |
          cd clawmes/bridges/sources/sa
          npm ci
          npm run build
