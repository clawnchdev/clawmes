name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check clawmes/ tests/

      - name: Format check
        run: ruff format --check clawmes/ tests/

      - name: Type check
        run: mypy clawmes/
        continue-on-error: true   # non-strict mode at this milestone

      - name: Test
        run: pytest -q --cov=clawmes --cov-report=term-missing --cov-fail-under=100

  bridges-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build wc bridge
        run: |
          cd clawmes/bridges/sources/wc
          npm ci
          npm run build
          test -f dist/index.mjs
      # The sa bridge will land in a follow-up commit; gating with a
      # presence check so this job stays green until then.
      - name: Build sa bridge (if present)
        run: |
          if [ -d clawmes/bridges/sources/sa ]; then
            cd clawmes/bridges/sources/sa
            npm ci
            npm run build
            test -f dist/index.mjs
          else
            echo "sa bridge sources not yet present — skipping"
          fi

  bridges-integration:
    runs-on: ubuntu-latest
    needs: bridges-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build wc bridge
        run: |
          cd clawmes/bridges/sources/wc
          npm ci
          npm run build
      - name: Run integration tests
        env:
          RUN_BRIDGE_INTEGRATION: "1"
        run: pytest tests/bridges/test_process_integration.py -v
