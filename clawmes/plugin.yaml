name: clawmes
version: 0.15.0
description: Hermes Agent for crypto. Wallet, swaps, DeFi, launches, automation.
author: Clawnch
kind: standalone

# Informational — the actual surface is registered programmatically in
# register(ctx). This list is the source of truth for what users will see
# in `hermes plugins list`, so it must match what register_all() actually
# wires. Do not list tools that aren't implemented; the policy is "promise
# only what ships." Additional tools land in subsequent versions and are
# added here at the same time their register() function lands.
provides_tools:
  - clawnchconnect
  - transfer
  - defi_swap
  - defi_lend
  - defi_stake
  - bridge
  - approvals
  - defi_price
  - defi_balance
  - yield
  - nft
  - safe
  - governance
  - farcaster
  - airdrop
  - watch_activity
  - clawnch_launch
  - clawnch_fees
  - bankr_launch
  - bankr_automate
  - bankr_polymarket
  - bankr_leverage
  - paysponge
  - lobster_cash
  - policy_manage
  - agent_identity
  - bv7x
  - bv7x_oracle
  - bv7x_market
  - eas_attestation
  - a2a_call
  - analytics
  - market_intel
  - cost_basis
  - block_explorer
  - molten
  - clawnx
  - hummingbot
  - wayfinder
  - giza
  - nookplot
  - privacy
  - herd_intelligence
  - agent_memory
  - skill_evolve
  - session_recall
  - permit2
  - compound_action
  - manage_orders
  - liquidity
  - browser
  - _user_tools

provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - pre_gateway_dispatch
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - transform_terminal_output
  - transform_tool_result
  - subagent_stop

# Optional — surfaced by hermes plugins install for interactive prompting.
# Listed env vars are consumed by tools / services that are actually wired;
# don't advertise env vars for unimplemented tools.
requires_env:
  - name: WALLETCONNECT_PROJECT_ID
    description: WalletConnect Cloud project ID (required for WC mode)
    url: https://cloud.walletconnect.com
    secret: false
  - name: BANKR_API_KEY
    description: Bankr API key (required for Bankr custodial mode)
    url: https://bankr.bot
    secret: true
  - name: ALCHEMY_API_KEY
    description: Alchemy RPC key for EVM chains (recommended; demo endpoints rate-limit aggressively)
    url: https://dashboard.alchemy.com
    secret: true
  - name: BASESCAN_API_KEY
    description: Basescan API key (block_explorer tool)
    url: https://basescan.org/myapikey
    secret: true
  - name: BV7X_API_KEY
    description: BV-7X session token (after wallet-verify at bv7x.ai/terminal#developer); required for token-gated oracle + copy-trade endpoints
    url: https://bv7x.ai/terminal#developer
    secret: true
  - name: CLAWNCH_API_KEY
    description: Clawnch agent API key; required for /launch (token deploy via Clawnch launchpad). Issue via /register_agent in clawmes.
    url: https://clawn.ch
    secret: true
  - name: OPENGATEWAY_API_KEY
    description: gitlawb OpenGateway API key (ogw_live_…); recommended but currently optional during the partnership window
    url: https://gitlawb.com/opengateway
    secret: true
  - name: OPENGATEWAY_MODEL
    description: Default model id sent to OpenGateway when callers do not pass model= (optional)
    url: https://gitlawb.com/opengateway
    secret: false
