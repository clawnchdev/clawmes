name: clawmes
version: 0.0.1
description: Hermes Agent for crypto. Wallet, swaps, DeFi, launches, automation.
author: Clawnch
kind: standalone

# Informational — actual surface is registered programmatically in register(ctx)
provides_tools:
  - clawnchconnect
  - transfer
  - permit2
  - approvals
  - defi_swap
  - defi_balance
  - defi_lend
  - defi_stake
  - defi_price
  - liquidity
  - manage_orders
  - bridge
  - yield
  - analytics
  - market_intel
  - cost_basis
  - clawnch_launch
  - clawnch_fees
  - bankr_launch
  - bankr_automate
  - bankr_polymarket
  - bankr_leverage
  - nft
  - airdrop
  - privacy
  - safe
  - governance
  - farcaster
  - block_explorer
  - herd_intelligence
  - watch_activity
  - browser
  - compound_action
  - molten
  - clawnx
  - hummingbot
  - wayfinder
  - agent_memory
  - skill_evolve
  - session_recall
  - giza
  - nookplot
  - paysponge
  - lobster_cash

provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - pre_gateway_dispatch
  - on_session_start
  - on_session_end
  - transform_terminal_output
  - transform_tool_result
  - subagent_stop

# Optional — surfaced by hermes plugins install for interactive prompting
requires_env:
  - name: WALLETCONNECT_PROJECT_ID
    description: WalletConnect Cloud project ID (required for WC mode)
    url: https://cloud.walletconnect.com
    secret: false
  - name: ALCHEMY_API_KEY
    description: Alchemy RPC key for EVM chains
    url: https://dashboard.alchemy.com
    secret: true
  - name: ZEROX_API_KEY
    description: 0x aggregator API key (improves swap routing)
    url: https://0x.org/docs
    secret: true
  - name: BASESCAN_API_KEY
    description: Basescan API key (block_explorer tool)
    url: https://basescan.org/myapikey
    secret: true
